---
# Database host image (Ubuntu 24.04 LTS). Run by Packer (ami/database) on a
# temporary build instance; the result is the bmc-database-<version> AMI.
# Configuration and secrets are not baked in: Terraform user data and SSM
# Parameter Store provide them at boot.
- name: Build the database host image
  hosts: all
  become: true
  roles:
    - base
    - docker
    - docker_logs
    - database

  post_tasks:
    - name: Remove packages that are no longer needed
      ansible.builtin.apt:
        autoremove: true
        purge: true

    - name: Remove downloaded packages
      ansible.builtin.apt:
        clean: true

    - name: Remove the package lists (the image does not need them)
      ansible.builtin.file:
        path: /var/lib/apt/lists
        state: absent
