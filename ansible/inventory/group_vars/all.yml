---
# Every host is reached with SSH tunnelled through SSM Session Manager: no
# open port, no permanent key on the hosts. ssm-ssh-proxy.sh pushes your public
# key with EC2 Instance Connect (60 seconds) and opens the tunnel. Your key:
# BMC_SSH_KEY, default ~/.ssh/bmc_dev (create it with ssh-keygen -t ed25519).
ansible_user: ec2-user
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'BMC_SSH_KEY', default='~/.ssh/bmc_dev') }}"
ansible_ssh_common_args: >-
  -o ProxyCommand="{{ inventory_dir }}/../ssm-ssh-proxy.sh %h %r %p"
  -o IdentitiesOnly=yes

bmc_environment: dev
# Fixed address of the monitoring host (environments/dev/main.tf).
monitoring_ip: 10.10.1.20
