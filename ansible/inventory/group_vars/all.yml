---
# Every host is reached through SSM Session Manager (no SSH, no open port).
# Files go through the environment's transfer bucket (Terraform output
# ansible_bucket) with presigned URLs, so the hosts need no S3 permission.
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: eu-north-1
ansible_aws_ssm_bucket_name: bmc-dev-ansible-641330543185
ansible_aws_ssm_s3_addressing_style: virtual

bmc_environment: dev
# Fixed address of the monitoring host (environments/dev/main.tf).
monitoring_ip: 10.10.1.20
