---
# Images pinned by digest (read from Docker Hub on 2026-11-21).
monitoring_prometheus_image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
monitoring_grafana_image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205

# How long Prometheus keeps metrics (the host's disk is 20 GiB).
monitoring_retention: 7d

monitoring_dir: /opt/bmc-monitoring
# Grafana's admin password, read from Parameter Store where Ansible runs.
monitoring_grafana_password_parameter: /bmc/{{ bmc_environment }}/monitoring/grafana_admin_password
