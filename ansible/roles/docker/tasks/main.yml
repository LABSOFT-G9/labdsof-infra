---
# Docker Engine and the Compose plugin from Ubuntu's own packages.

- name: Install Docker and Docker Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    install_recommends: false
    update_cache: true

- name: Start Docker now and at every boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
