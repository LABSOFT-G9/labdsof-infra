---
# Docker Engine and the Compose plugin: Ubuntu (database image) and Amazon
# Linux 2023 (application and monitoring hosts).

- name: Install Docker and Docker Compose (Ubuntu)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    install_recommends: false
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Docker (Amazon Linux)
  ansible.builtin.dnf:
    name: docker
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create the Docker CLI plugin directory (Amazon Linux)
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install the Docker Compose plugin, checksum-verified (Amazon Linux)
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ ansible_facts['architecture'] }}"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    checksum: "sha256:{{ docker_compose_sha256[ansible_facts['architecture']] }}"
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts['os_family'] == 'RedHat'

- name: Start Docker now and at every boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
