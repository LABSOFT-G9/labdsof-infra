---
# Application host: Docker and Compose (docker role), the directory the
# application repository's deploy job copies its compose.yaml to, and the
# script that job runs (bmc-app-deploy <image tag>, over SSM Run Command).

- name: Install jq (the deploy script reads Parameter Store's JSON)
  ansible.builtin.dnf:
    name: jq
    state: present

- name: Create the application directory
  ansible.builtin.file:
    path: /opt/bmc-app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create /etc/bmc
  ansible.builtin.file:
    path: /etc/bmc
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the deploy configuration
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/bmc/app.env
    owner: root
    group: root
    mode: "0644"

- name: Install the deploy script
  ansible.builtin.copy:
    src: bmc-app-deploy
    dest: /usr/local/bin/bmc-app-deploy
    owner: root
    group: root
    mode: "0755"

# DuckDNS: keeps the environment's public name pointing at the edge host,
# whose address changes on stop/start (bmc-duckdns-update explains why it runs
# here and not on the edge host).
- name: Install the DuckDNS update script
  ansible.builtin.copy:
    src: bmc-duckdns-update
    dest: /usr/local/bin/bmc-duckdns-update
    owner: root
    group: root
    mode: "0755"

- name: Install the DuckDNS update units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - bmc-duckdns-update.service
    - bmc-duckdns-update.timer

- name: Enable the DuckDNS update timer
  ansible.builtin.systemd_service:
    name: bmc-duckdns-update.timer
    enabled: true
    state: started
    daemon_reload: true
  when: app_duckdns_domain | length > 0
