---
# Database host (fixed address, environments/<env>/main.tf) and the service
# databases, as in terraform.tfvars `databases`; each password is
# /bmc/<env>/database/users/<name> and reaches the containers as
# <NAME>_DB_PASSWORD.
app_database_host: 10.10.1.30
app_databases:
  - issue
  - dispatch
  - notification
  - keycloak

# Public name of the environment (Keycloak's hostname and token issuer, the
# TLS certificate). DuckDNS: app_duckdns_domain is the part before
# .duckdns.org, kept pointing at the edge host by bmc-duckdns-update.timer
# with the token in /bmc/<env>/app/duckdns_token. Empty: no DuckDNS update.
app_duckdns_domain: bmc-g9
app_public_host: "{{ app_duckdns_domain }}.duckdns.org"

# Application secrets (for example Keycloak's admin password and client
# secrets, EN-02-04): each name is read at deploy time from
# /bmc/<env>/app/secrets/<name> and reaches Compose as <NAME>
# (keycloak_admin_password -> KEYCLOAK_ADMIN_PASSWORD). Create the parameter
# before adding its name here, or the deploy stops.
app_secrets: []
