# Database host containers. Images pinned by digest (read 2026-11-16);
# Dependabot or a manual update changes the digest, then a new AMI is built.
# Secrets come from /run/bmc (tmpfs), written by bootstrap.sh from SSM.
name: bmc-database

services:
  mysql:
    # mysql:8.4 (LTS)
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: bmc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/bmc/root_password
      # root only from inside the host (the image's default is root@'%').
      # Applies to a new data directory; bootstrap.sh removes root@'%' from
      # existing ones.
      MYSQL_ROOT_HOST: localhost
    ports:
      - "3306:3306"
    volumes:
      - /var/lib/bmc-mysql/data:/var/lib/mysql
      - /run/bmc/root_password:/run/bmc/root_password:ro
      # Creates the backup and exporter users on the first start only.
      - /run/bmc/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  mysqld-exporter:
    # prom/mysqld-exporter:v0.17.2
    image: prom/mysqld-exporter:v0.17.2@sha256:20b5b23a98ce3998349042a999e56d22819b46da38fa4e4e9ca0155c975c95d5
    container_name: bmc-mysqld-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/run/bmc/exporter.my.cnf
      - --mysqld.address=mysql:3306
    ports:
      - "9104:9104"
    volumes:
      - /run/bmc/exporter.my.cnf:/run/bmc/exporter.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
