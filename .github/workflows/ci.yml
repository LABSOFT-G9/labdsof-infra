name: CI

# One workflow. Nothing changes AWS without a person approving it.
#
#   pull request:            lint -> plan dev, plan prod
#   main (after merge):      lint -> plan dev, plan prod -> apply dev -> apply prod
#                            each apply waits for approval (Review deployments
#                            on the run), and only runs if its plan has changes
#   Run workflow (button):   lint -> plan <environment> -> apply or destroy it,
#                            after approval (Actions -> CI -> Run workflow, on
#                            main; choose the environment and the action). For
#                            destroying, or re-applying without a new merge.
#                            stop / start: lint -> power, after approval: stops
#                            or starts the environment's instances (no plan; the
#                            Terraform state does not change).
#
# lint     no AWS access: terraform fmt / validate / TFLint, packer fmt /
#          validate, ansible-lint, ShellCheck
# plan     the plan is shown in the job summary and saved (a destroy plan when
#          the action is destroy)
# changes  lists the environments whose plan has changes, dev before prod
# apply    one job per listed environment, in its GitHub environment (required
#          reviewers: the run waits until someone approves). Applies exactly
#          the saved plan. prod only after dev succeeded.
#
# AWS access: the access key of the IAM user bmc-ci (repository secrets), which
# switches into the role bmc-admin. The AWS Organization denies GitHub OIDC.
# The user, the role and the state bucket come from bootstrap/ (README "GitHub
# settings"). Pins: full commit SHAs resolved with `gh api` on 2026-11-16.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options: [dev, prod]
        required: true
      action:
        description: "apply: create or update it; destroy: remove everything in it, including its buckets; stop: stop its instances (disks and data kept); start: start them again"
        type: choice
        options: [apply, destroy, stop, start]
        default: apply
        required: true

permissions:
  contents: read

# PRs: a new push cancels the older run. main and the button: runs queue in the
# same group and are never cancelled, so an apply or destroy is never
# interrupted and never runs at the same time as another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.17.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.16.2

      - name: Terraform format
        run: terraform fmt -check -recursive -diff
      - name: Terraform validate and TFLint
        env:
          # tflint --init downloads the ruleset from GitHub releases; without a
          # token the shared runner IPs hit the anonymous rate limit (403).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          for dir in environments/dev environments/prod bootstrap; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            (cd "$dir" && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl")
            echo "::endgroup::"
          done
      - name: Packer format and validate
        run: |
          packer fmt -check -diff ami/database
          packer init ami/database
          packer validate -syntax-only -var version=0.0.0 ami/database
      - name: Ansible lint
        working-directory: ansible
        run: |
          pipx install ansible-lint==26.11.0
          pipx inject ansible-lint ansible-core==2.21.6
          ansible-lint
      - name: ShellCheck
        run: shellcheck ansible/roles/database/files/*.sh

  plan:
    name: Plan ${{ matrix.env }}
    needs: lint
    # Fork PRs get no secrets, so they stop at lint. stop/start need no plan.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      inputs.action != 'stop' && inputs.action != 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Button: the chosen environment; otherwise both.
        env: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["dev","prod"]') }}
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: gh-plan-${{ matrix.env }}-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -lock-timeout=5m -backend-config="bucket=${STATE_BUCKET}"

      - name: Plan
        env:
          ENVIRONMENT: ${{ matrix.env }}
          ACTION: ${{ inputs.action || 'apply' }}
        run: |
          args=()
          [ "$ACTION" = destroy ] && args=(-destroy)
          set +e
          terraform plan "${args[@]}" -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          case "$code" in
            0) echo false > changes ;;
            2) echo true > changes ;;
            *) exit "$code" ;;
          esac
          {
            echo "## Plan (${ACTION}): ${ENVIRONMENT} (changes: $(cat changes))"
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The plan file may contain sensitive values: kept one day, this run only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            environments/${{ matrix.env }}/tfplan
            environments/${{ matrix.env }}/changes
          retention-days: 1
          if-no-files-found: error

  # Which environments have something to apply, dev first. An environment
  # without changes gets no apply job, so nobody is asked to approve nothing.
  changes:
    name: Changes
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tfplan-*
          path: plans
      - name: List environments with changes
        id: list
        run: |
          envs=()
          for env in dev prod; do
            file="plans/tfplan-$env/changes"
            if [ -f "$file" ] && [ "$(cat "$file")" = true ]; then
              envs+=("\"$env\"")
            fi
          done
          list="[$(IFS=,; echo "${envs[*]}")]"
          echo "envs=$list" >>"$GITHUB_OUTPUT"
          echo "Environments to apply: $list" >>"$GITHUB_STEP_SUMMARY"

  apply:
    name: ${{ inputs.action || 'apply' }} ${{ matrix.env }}
    needs: changes
    if: needs.changes.outputs.envs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The GitHub environment has required reviewers: the job waits for an
    # approval (Review deployments). The reviewer can read this run's plan in
    # its summary first.
    environment: ${{ matrix.env }}
    strategy:
      max-parallel: 1 # dev, then prod
      fail-fast: true # dev failed -> prod does not run
      matrix:
        env: ${{ fromJSON(needs.changes.outputs.envs) }}
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ matrix.env }}
          path: environments/${{ matrix.env }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: gh-${{ inputs.action || 'apply' }}-${{ matrix.env }}-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -lock-timeout=5m -backend-config="bucket=${STATE_BUCKET}"

      # Applies exactly the saved plan (or destroy plan). If the state changed
      # since the plan, Terraform refuses ("saved plan is stale") and nothing
      # is changed. A destroy removes the environment's buckets with the
      # attachments and backups; the state file stays (empty).
      - name: Apply
        run: terraform apply -lock-timeout=5m tfplan

  # Stop or start the environment's instances (tag Environment=<env>). Stopped
  # instances cost nothing; their disks keep their data and are still billed.
  # start brings the edge host up first, so the private hosts have NAT when
  # they boot. The Terraform state does not change.
  power:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    needs: lint
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.action == 'stop' || inputs.action == 'start')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: gh-${{ inputs.action }}-${{ inputs.environment }}-${{ github.run_id }}
      - name: ${{ inputs.action }} the instances
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ids() { # instance IDs of this environment in the given states, optionally only the edge host
            local name_filter=()
            [ "${2:-}" = edge ] && name_filter=(Name=tag:Name,Values="bmc-${ENVIRONMENT}-edge")
            aws ec2 describe-instances \
              --filters Name=tag:Project,Values=bmc Name=tag:Environment,Values="$ENVIRONMENT" \
                        Name=instance-state-name,Values="$1" "${name_filter[@]}" \
              --query 'Reservations[].Instances[].InstanceId' --output text
          }
          if [ "$ACTION" = stop ]; then
            todo=$(ids running,pending)
            if [ -z "$todo" ]; then echo "Nothing running in $ENVIRONMENT."; exit 0; fi
            # shellcheck disable=SC2086 # word splitting is the point: one ID per word
            aws ec2 stop-instances --instance-ids $todo --query 'StoppingInstances[].[InstanceId,CurrentState.Name]' --output text
            # shellcheck disable=SC2086
            aws ec2 wait instance-stopped --instance-ids $todo
          else
            edge=$(ids stopped edge)
            if [ -n "$edge" ]; then
              aws ec2 start-instances --instance-ids "$edge" --query 'StartingInstances[].[InstanceId,CurrentState.Name]' --output text
              aws ec2 wait instance-running --instance-ids "$edge"
            fi
            rest=$(ids stopped)
            if [ -n "$rest" ]; then
              # shellcheck disable=SC2086
              aws ec2 start-instances --instance-ids $rest --query 'StartingInstances[].[InstanceId,CurrentState.Name]' --output text
              # shellcheck disable=SC2086
              aws ec2 wait instance-running --instance-ids $rest
            fi
          fi
          {
            echo "## ${ACTION} ${ENVIRONMENT}"
            echo '```'
            aws ec2 describe-instances \
              --filters Name=tag:Project,Values=bmc Name=tag:Environment,Values="$ENVIRONMENT" \
                        Name=instance-state-name,Values=pending,running,stopping,stopped \
              --query 'Reservations[].Instances[].[Tags[?Key==`Name`]|[0].Value,State.Name,PublicIpAddress]' --output text
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # The single check to require on main (lint and the plans).
  ci-required:
    name: ci-required
    if: always()
    needs: [lint, plan]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended with $r"; exit 1;; esac
          done
