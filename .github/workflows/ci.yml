name: CI

# Static checks only: no AWS credentials, nothing is planned or applied.
# terraform fmt/validate per environment, TFLint, packer fmt/validate,
# ShellCheck for the AMI scripts. Actions are pinned to full commit SHAs
# resolved with `gh api` on 2026-11-16.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [environments/dev, environments/prod, bootstrap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: TFLint
        working-directory: ${{ matrix.dir }}
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  packer:
    name: Packer (database AMI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.16.2
      - name: Format and validate
        run: |
          packer fmt -check -diff ami/database
          packer init ami/database
          packer validate -syntax-only -var version=0.0.0 ami/database
      - name: ShellCheck
        run: shellcheck ami/database/scripts/*.sh ami/database/files/*.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [terraform, packer]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "A job ended with $r"; exit 1; }; done
